# Deploys the Supabase Edge Function "coach" whenever its code changes on main.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access tokens).
name: Deploy coach function
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-coach.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo 'SUPABASE_ACCESS_TOKEN secret not added yet - skipping deploy.'
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Deploy
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy coach --project-ref ekpkhvqjllquhztbtpsx --no-verify-jwt --use-api
