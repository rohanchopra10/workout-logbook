<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Workout Logbook</title>
<meta name="description" content="Personal workout log with weekly plans, last-time numbers and progress.">
<meta name="theme-color" content="#1C1E2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logbook">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1C1E2A;--surface:#252836;--ink:#ECECEA;--muted:#A6A8B4;--line:#363A4C;--field:#2E3142;
  --accent:#FB5102;--accent-ink:#1C1E2A;--accent-soft:#3A2A26;--danger:#FF7B72;--pr:#FF7A3D;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.cond{font-family:"Space Grotesk",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 92px}
.top h1{overflow-wrap:anywhere;font:700 40px/1 "Space Grotesk",system-ui,sans-serif;margin:6px 0 2px;letter-spacing:.3px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.panel,.ex,details.wk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.ex{border-left:5px solid var(--accent);border-radius:6px 14px 14px 6px}
h2{font:700 20px/1.2 "Space Grotesk",system-ui,sans-serif;margin:0 0 8px}
label{display:block;font-size:14px;color:var(--muted);font-weight:500;margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
textarea{resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>label{min-width:0}
input[type="date"]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left;max-width:100%}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
.ex-head{display:flex;gap:8px;align-items:center}
.ex-name{margin:0;font:600 21px/1.2 "Space Grotesk",system-ui,sans-serif;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 2px}
.last{margin:8px 0 10px;font-size:14px;color:var(--muted)}
.set{display:grid;grid-template-columns:20px minmax(0,1fr) auto minmax(0,1fr) 44px 28px;gap:6px;align-items:center;margin-bottom:8px}
.set:not(.done) input{color:var(--muted)}
.tick{min-height:44px;padding:0;background:var(--field);border:2px solid var(--line);color:var(--muted);font-weight:700;font-size:18px}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set .icon{width:28px}
.set.timed{grid-template-columns:20px minmax(0,1fr) minmax(88px,auto) 44px 28px}
.tbtn{min-height:44px;padding:8px 10px;background:var(--accent-soft);color:var(--accent);font-weight:700;border:1px solid var(--accent);font-variant-numeric:tabular-nums}
.tbtn.on{background:var(--accent);color:var(--accent-ink)}
.setn{font:600 17px "Space Grotesk",sans-serif;color:var(--muted);text-align:center}
.set input{margin:0;text-align:center;font:600 23px/1 "Space Grotesk",system-ui,sans-serif;padding:9px 6px}
.set input::placeholder{color:var(--muted);opacity:.55}
.x{color:var(--muted);font-size:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid transparent;padding:10px 14px;min-height:44px;color:var(--ink)}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;width:100%}
.btnrow .primary,.empty .primary{width:auto}
.ghost{background:transparent;color:var(--accent);border-color:var(--line);font-weight:600}
.sm{padding:8px 12px;min-height:40px;font-size:15px}
.danger{color:var(--danger)}
.icon{background:transparent;color:var(--muted);min-height:36px;width:36px;padding:0;font-size:16px;flex:none}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--field);padding:4px;border-radius:12px;margin-bottom:12px}
.seg button{min-height:40px;background:transparent;color:var(--muted);font-weight:600;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:7px 2px;min-height:74px;background:var(--field);border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.day .dn{font:600 16px/1 "Space Grotesk",system-ui,sans-serif}
.day .ds{font-size:11px;line-height:1.15;color:var(--muted);text-align:center;hyphens:manual;overflow-wrap:anywhere}
.day .dk{font-size:10px;font-weight:700;color:var(--pr)}
.day.today{border:2px solid var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day.sel .ds,.day.sel .dk{color:inherit}
.todayrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}
.todayrow .sm{flex:none}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.qrow input{margin:0}
.qrow .primary{width:auto}
.weigh{border-color:var(--accent)}
.day .dk.sk{color:var(--muted)}
details.wk.skipped{opacity:.7}
.target{margin:8px 0 0;font-weight:600;color:var(--accent);font-size:15px}
.plansum{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.wlabel{margin:6px 0 6px!important;color:var(--ink)!important;font-weight:600}
.wcount{color:var(--muted);font-weight:500;margin-left:6px}
.chips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:6px}
.chip{min-height:44px;padding:0;background:var(--field);border:1px solid var(--line);font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#wiz .seg{margin-bottom:8px}
.ex-title{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 2px;min-width:0;font:600 21px/1.2 "Space Grotesk",system-ui,sans-serif;color:var(--ink)}
.ex-title span:first-child{min-width:0;overflow-wrap:anywhere}
.swap-hint{flex:none;font:600 13px "Manrope",system-ui,sans-serif;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 10px}
.swap-list{display:grid;gap:6px}
.swap-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--field);border:1px solid var(--line);font-weight:600;color:var(--ink)}
.swap-last{font-weight:400;font-size:13px;color:var(--muted)}
.warm summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.warm summary::-webkit-details-marker{display:none}
.wmeta{color:var(--muted);font-size:14px}
.wlist{display:grid;gap:6px}
.witem{display:flex;align-items:flex-start;gap:10px;text-align:left;background:var(--field);border:1px solid var(--line);color:var(--ink);font-size:15px;line-height:1.35;padding:10px 12px}
.wbox{flex:none;width:22px;height:22px;border:2px solid var(--accent);border-radius:6px;display:grid;place-items:center;font-weight:700;color:var(--accent-ink);margin-top:-1px}
.witem[aria-pressed="true"]{color:var(--muted)}
.witem[aria-pressed="true"] span:last-child{text-decoration:line-through}
.witem[aria-pressed="true"] .wbox{background:var(--accent)}
.lastbox{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent)}
.lb-h{font-size:13px;font-weight:600;color:var(--accent)}
.lb-sets{font:600 22px/1.25 "Space Grotesk",system-ui,sans-serif;color:var(--ink);word-spacing:2px;margin:2px 0}
.lb-next{font-size:14px;font-weight:600;color:var(--ink)}
.xnote{margin:4px 0 0;font-size:13px;color:var(--pr);font-weight:600}
.lb-ready{margin-top:6px;font-size:14px;font-weight:700;color:var(--pr)}
.xs-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.xs-head h2{margin:0}
.xs-sub{margin:2px 0 0!important;color:var(--muted);font-size:14px}
.likebtn{flex:none;min-height:40px;padding:6px 12px;background:var(--field);border:1px solid var(--line);color:var(--pr);font-weight:700}
.likebtn[aria-pressed="true"]{background:var(--pr);color:#fff;border-color:var(--pr)}
.avoidnote{background:var(--field);border-radius:10px;padding:8px 10px;color:var(--ink)!important;font-size:14px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:0;min-height:0;text-decoration:underline}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.rchip{min-height:44px;font-size:14px;padding:6px 8px}
.chip[aria-pressed="true"].rchip{background:var(--accent);color:var(--accent-ink)}
.safety{border:2px solid var(--danger);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px;line-height:1.45;color:var(--ink)}
.swap-why{font-weight:400;font-size:13px;color:var(--accent)}
.about{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.about summary{cursor:pointer;font-weight:600;color:var(--accent);padding:6px 0}
.facts{display:grid;gap:0;margin:6px 0 8px}
.fact{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.fact span:first-child{color:var(--muted);flex:none}
.fact span:last-child{text-align:right;font-weight:600}
.demo{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/2;background:#0b0f14;margin:4px 0 8px}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo .db{animation:demoSwap 2.4s ease-in-out infinite}
@keyframes demoSwap{0%,30%{opacity:0}45%,80%{opacity:1}95%,100%{opacity:0}}
.demo .tag{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.demo .db{animation:none;opacity:0}}
.howto{margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:0 12px}
.howto summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:600;font-size:14px;color:var(--accent);list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:'▸';margin-right:8px;transition:transform .15s}
.howto[open] summary::before{transform:rotate(90deg)}
.howto[open]{padding-bottom:10px}
.steps{margin:6px 0 0;padding-left:22px;font-size:14px;line-height:1.45;color:var(--ink)}.steps li{margin:0 0 5px}.steps li::marker{color:var(--accent);font-weight:700}
.cue{margin:8px 0 0!important;color:var(--ink)!important;font-size:14px;line-height:1.45}
.libsheet{max-height:90vh}
#l-q{margin:6px 0 10px}
.catrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -2px 6px;scrollbar-width:none}
.catrow::-webkit-scrollbar{display:none}
.catchip{flex:none;min-height:40px;padding:6px 12px;font-size:14px;white-space:nowrap}
.lsub{font:700 17px "Space Grotesk",system-ui,sans-serif;margin:12px 2px 6px;color:var(--muted)}
.lrow{display:flex;gap:6px;margin-bottom:6px}
.lrow.dim .lname{color:var(--muted)}
.lmain{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--field);border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:10px}
.lmain.static{cursor:default}
.lname{font-weight:600}
.lmeta{font-size:13px;color:var(--muted);font-weight:400}
.lflags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.badge{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)}
.badge.like{color:var(--pr);border-color:var(--pr)}
.badge.done{color:var(--accent);border-color:var(--accent)}
.linfo{flex:none;width:44px;background:var(--field);border:1px solid var(--line);color:var(--accent);font-weight:700;font-style:italic;font-family:Georgia,serif}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tagrow .chip{min-height:38px;padding:6px 10px;font-size:13px;font-weight:600}
.tagrow .eqchip{background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
.tagrow .eqchip::before{content:'✓ '}
.tagrow .eqchip[aria-pressed="false"]{background:transparent;color:var(--muted);border-color:var(--line);text-decoration:line-through}
.tagrow .eqchip[aria-pressed="false"]::before{content:''}
.cxbox{border:1px solid var(--line);border-radius:10px;padding:10px 10px 0;margin-bottom:8px}
.cxhead{display:flex;gap:6px;align-items:flex-end;margin-bottom:10px}
.cxrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cxrow.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.cxrow.one{grid-template-columns:minmax(0,1fr)}
.cxrow input{text-align:center;font:600 21px "Space Grotesk",system-ui,sans-serif}
.fb{margin:12px 0 4px;padding:12px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent)}
.fbtitle{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font:700 19px "Space Grotesk",system-ui,sans-serif;color:var(--accent)}
.fbtitle .sm{min-height:36px;padding:4px 10px;font-size:14px}
.fbh{margin:10px 0 2px;font-weight:700;color:var(--ink)}
.fb ul{margin:0;padding-left:18px}
.fb li{margin:2px 0;font-size:15px;line-height:1.4}
.savedbar{border-color:var(--accent);background:var(--accent-soft);font-size:15px;color:var(--ink)}
.donecard{text-align:center;padding:22px 16px}
.donebig{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:30px;font-weight:700}
.todayrow{align-items:flex-end}
.pick{flex:1;min-width:0;margin:0}
.pickday{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:2px}
.pickwrap{position:relative;display:block}
.pickwrap::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:18px;pointer-events:none}
#f-pick{-webkit-appearance:none;appearance:none;margin:0;padding:8px 36px 8px 12px;font:700 22px/1.2 "Space Grotesk",system-ui,sans-serif;color:var(--ink);background:var(--surface);border:2px solid var(--accent);border-radius:12px}
.cgchip{min-height:44px!important;padding:8px 14px!important;font-size:15px!important}
.abs-h{margin:18px 2px 6px;font-size:24px}
.add-ex{width:100%;background:var(--accent-soft);color:var(--accent);font-weight:600;border:1px dashed var(--accent);margin-bottom:12px}
.editing{color:var(--pr);font-weight:600;margin:0 0 8px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs button{background:none;border-radius:0;color:var(--muted);font:600 17px "Space Grotesk",system-ui,sans-serif;min-height:56px;border:0;border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
details.wk summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:0 10px;cursor:pointer}
details.wk summary::-webkit-details-marker{display:none}
.wk-date{font:700 21px/1.2 "Space Grotesk",system-ui,sans-serif}
.wk-type{grid-column:1}
.wk-meta{grid-column:2;grid-row:1/3;align-self:center;color:var(--muted);font-size:14px;text-align:right}
.wk-body{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.line{display:flex;flex-direction:column;padding:7px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.ln{font-weight:600}
.ls{font:500 19px/1.25 "Space Grotesk",system-ui,sans-serif;color:var(--muted)}
.extra{margin:8px 0;font-size:15px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{display:block;font:700 44px/1 "Space Grotesk",system-ui,sans-serif}
.big small{font-size:18px;color:var(--muted);font-weight:600}
.cap{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.chart{width:100%;height:auto;display:block}
.chart .cl{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart circle{fill:var(--accent)}
.chart text{fill:var(--muted);font:12px "Manrope",system-ui,sans-serif}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.pr{font-style:normal;font-size:12px;font-weight:700;color:var(--pr);border:1px solid currentColor;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
#m-text{white-space:pre-line}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.count{color:var(--muted);font-size:14px;margin:0 0 10px}
.row-line{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.row-line:last-child{border-bottom:0}
.row-line .kg{font:600 21px "Space Grotesk",system-ui,sans-serif}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:16px;padding:16px;width:100%;max-width:520px;max-height:85vh;overflow:auto}
.sheet p{margin:0 0 10px;color:var(--muted)}
.sheet #m-input{margin:0 0 12px;font:600 24px "Space Grotesk",system-ui,sans-serif;text-align:center}
.sheet textarea{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:170px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.authscreen{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.authbox{max-width:420px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px}
.authbox h1{font:700 34px/1 "Space Grotesk",system-ui,sans-serif;margin:10px 0 6px;text-align:center}
.authlogo{text-align:center}.authlogo img{width:64px;height:64px;border-radius:16px}
.authsub{color:var(--muted);text-align:center;margin:0 0 16px;font-size:15px}
.authtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 14px}
.authtabs button{min-height:40px;background:transparent;color:var(--muted);font-weight:600}
.authtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

const REASON_SAVE={unavailable:'Not available at your gym',dislike:'You don\'t like it',discomfort:'Causes discomfort',hard:'Too difficult for now'};

/* Rank alternatives for an exercise: same movement first, then same main muscle; filter by gym equipment and avoided exercises. */
function alternatives(name,reason,exclude){
  const o=libFor(name);if(!o)return [];
  const ex=new Set((exclude||[]).map(x=>norm(canonName(x))));ex.add(norm(o.name));
  const mach=o.equip.filter(x=>!['db','bench','bb','ez','kb','band'].includes(x));
  const out=[];
  for(const c of LIB){
    if(ex.has(norm(c.name))||isAvoided(c.name)||!hasEquip(c))continue;
    if(c.cat==='Full Body'&&o.cat!=='Full Body')continue;
    let s=0;const why=[];
    const samePat=c.pattern===o.pattern,samePrim=c.primary===o.primary;
    if(!samePat&&!samePrim&&c.sub!==o.sub)continue;
    s+=samePat?(reason==='discomfort'?15:50):0;s+=samePrim?(reason==='discomfort'?30:20):0;s+=c.sub===o.sub?8:0;s+=c.kind===o.kind?5:0;
    s-=Math.abs(c.level-o.level)*(reason==='easy'?2:6);s-=Math.abs(c.fatigue-o.fatigue)*2;if(c.niche)s-=10;if(c.body&&!o.body)s-=4;
    if(isLiked(c.name)){s+=10;why.push('you like it')}
    if(hasHistory(c.name)){s+=6;why.push('you\'ve done it before')}
    const sharesMachine=c.equip.some(x=>mach.includes(x));
    if(reason==='busy'||reason==='unavailable'){if(sharesMachine)continue}
    if(reason==='hard'){if(c.level<o.level||c.fatigue<o.fatigue){s+=15;why.push('easier to control')}else if(c.level>o.level)s-=30}
    if(reason==='easy'){if(c.level>o.level||c.fatigue>o.fatigue||c.uni&&!o.uni){s+=15;why.push('more challenging')}else if(c.level<o.level)s-=20}
    if(reason==='discomfort'){if(c.equip.some(x=>x==='cable'||x.startsWith('m-')||['pecdeck','rpd','legpress','legext','legcurl','lat','row','hack'].includes(x))){s+=10;why.push('guided, steadier path')}if(c.fatigue<o.fatigue){s+=8}if(samePat)s-=5}
    const main=samePat?`Same movement (${PATTERN[c.pattern].toLowerCase()})`:samePrim?`Same main muscle (${c.primary.toLowerCase()})`:`Works ${c.primary.toLowerCase()}`;
    out.push({name:c.name,score:s,samePat,why:[main,...why].join(', '),equip:c.equip.map(x=>EQ_LABEL[x]).join(' + ')||'Bodyweight'});
  }
  out.sort((a,b)=>b.score-a.score);
  if(reason==='dislike'||reason==='discomfort'){
    const A=out.filter(x=>x.samePat),B=out.filter(x=>!x.samePat);
    if(reason==='discomfort')return (B.length>=3?B:[...B,...A]).slice(0,6);
    const mix=[];for(let i=0;mix.length<6&&(i<A.length||i<B.length);i++){if(A[i])mix.push(A[i]);if(B[i])mix.push(B[i])}
    return mix.slice(0,6);
  }
  return out.slice(0,6);
}
/* When building a workout: use the person's own replacement, or pick the best alternative if an exercise is avoided or its equipment isn't in the gym. */
function resolveExercise(name,taken){
  const p=prefs(),c=canonName(name),e=libFor(c);
  const rep=p.replace[c];
  if(rep&&!taken.has(norm(rep))){const re=libFor(rep);if(!isAvoided(rep)&&(!re||hasEquip(re)))return {name:rep,note:`Your pick instead of ${c}`}}
  const bad=isAvoided(c)?REASON_SAVE[p.avoid[c].reason]||'Avoided':(e&&!hasEquip(e)?'Not in your gym':'');
  if(!bad)return {name:c};
  const alt=alternatives(c,'unavailable',[...taken])[0];
  return alt?{name:alt.name,note:`Replaces ${c} (${bad.toLowerCase()})`}:{name:c};
}

  const r=rotationFor(date),lifts=parts.filter(g=>g!=='Core'),per=lifts.length<=1?6:lifts.length===2?3:2,out=[];
  for(const g of lifts){const src=TEMPLATES[GROUP_SRC[g]];const v=src[r%src.length];const pick=v.filter(n=>{const e=libFor(n);return e&&e.cat===g});

function nextTip(name,sets){
  const ts=sets.map(s=>+s.t||0);if(ts.some(x=>x>0)){const m=Math.max(...ts);return `Next: hold ${m+5}–${m+10} sec`}
  const ws=sets.map(s=>blank(s.w)?0:+s.w),rs=sets.map(s=>+s.r||0);
  if(!ws.some(x=>x>0)){const m=Math.min(...rs.filter(x=>x>0));return m>=15?'Next: same reps, slower (3 sec down) or add light weight':`Next: aim for ${m+2}+ reps every set`}
  const top=Math.max(...ws),topR=rs.filter((_,i)=>ws[i]===top),minR=Math.min(...topR);
  const inc=/\bDB\b|dumbbell|cable/i.test(name)?2.5:5;
  if(topR.length>=2&&minR>=12)return `Next: try ${fmtNum(top+inc)} kg × 10–12 (you hit ${minR}+ on every top set)`;
  if(topR.length===1&&minR>=12)return `Next: do 2–3 sets at ${fmtNum(top)} kg, aim for 12`;
  if(minR<8){const lower=Math.max(...ws.filter(x=>x<top),0);return lower?`Next: ${fmtNum(lower)} kg × 12–15, build up before ${fmtNum(top)} kg again`:`Next: stay at ${fmtNum(top)} kg, aim for 8–10 reps`}
  return `Next: stay at ${fmtNum(top)} kg, beat ${topR.join('/')} reps`;
}
function targetLine(ex){
  const t=targetFor(ex.name),e=libFor(ex.name);let s='';
  if(t)s+=`<p class="target">${esc(e.primary)} · ${t.sets} × ${esc(t.reps)}${t.timed&&!/sec/.test(t.reps)?' sec':''} · rest ${esc(t.rest)}</p>`;

}
function readyLine(name,sets){
  const t=targetFor(name);if(!t||!sets.length)return '';const top=t.range[1];if(!top)return '';
  if(sets.some(s=>!blank(s.t))){return sets.every(s=>+s.t>=top)?'You held the top of the range every set. Add 5–10 sec or a harder version when it feels easy.':''}
  const ws=sets.map(s=>blank(s.w)?0:+s.w),rs=sets.map(s=>+s.r||0);
  if(!ws.some(x=>x>0))return rs.every(r=>r>=top)?'Top of the range on every set. Ready for added weight or a harder version.':'';

function chart(vals,labels){
  const W=320,H=150,px=38,pr=10,pt=14,pb=24,n=vals.length;
  const hi=Math.max(...vals),lo=Math.min(...vals);let mx=hi,mn=lo;if(mx===mn){mx+=1;mn-=1}const pad=(mx-mn)*.12;mx+=pad;mn-=pad;
  const x=i=>px+i*(W-px-pr)/(n-1),y=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart from ${fmtNum(lo)} to ${fmtNum(hi)}">
  <line class="grid" x1="${px}" x2="${W-pr}" y1="${y(hi)}" y2="${y(hi)}"/><line class="grid" x1="${px}" x2="${W-pr}" y1="${y(lo)}" y2="${y(lo)}"/>
  <text x="${px-6}" y="${y(hi)+4}" text-anchor="end">${fmtNum(hi)}</text>${hi!==lo?`<text x="${px-6}" y="${y(lo)+4}" text-anchor="end">${fmtNum(lo)}</text>`:''}
  <polyline class="cl" points="${pts}"/>${vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2"/>`).join('')}
  <text x="${x(0)}" y="${H-5}">${esc(labels[0])}</text><text x="${x(n-1)}" y="${H-5}" text-anchor="end">${esc(labels[n-1])}</text></svg>`;
}
function exerciseNames(){const m=new Map();for(const w of sorted())for(const e of w.exercises){const k=norm(e.name);if(!m.has(k))m.set(k,e.name)}return [...m.values()].sort((a,b)=>a.localeCompare(b))}
const MG_COL={Chest:'#5B8DEF',Back:'#F2C94C',Legs:'#6FD39B',Shoulders:'#FB5102',Arms:'#B58CFF',Abs:'#4FD1C5','Full body':'#F28FB1',Other:'#7D8091'};
function muscleOf(n){
  if(isAbs(n))return 'Abs';const e=libFor(n),c=e?e.cat:'';
  const map={Chest:'Chest',Back:'Back',Shoulders:'Shoulders',Traps:'Shoulders',Biceps:'Arms',Triceps:'Arms',Legs:'Legs',Core:'Abs','Full Body':'Full body',Bodyweight:'Other'};
  if(['Warm-Up','Cardio','Stretching / Cool-Down'].includes(c))return null;
  if(map[c])return map[c];
  const s=String(n||'').toLowerCase();
  if(/bench|chest|\bfly|flye|pec|push-?up|\bdips?\b|(flat|incline|decline) (db |dumbbell |machine )?press/.test(s))return 'Chest';
  if(/\brows?\b|pull|\blats?\b|deadlift|back ext/.test(s))return 'Back';
  if(/shoulder|lateral|delt|overhead|military|shrug|face pull|arnold/.test(s))return 'Shoulders';
  if(/curl|tricep|pushdown|skull|kickback|extension/.test(s)&&!/leg|hamstring/.test(s))return 'Arms';

}
function muscleHTML(){
  const m={};let total=0;

  if(!total)return '';

  const pcts=rows.map(([,v])=>Math.round(v/total*100));

}

'Chin-ups':'Hang from the bar with palms facing you, hands shoulder-width.|Pull until your chin passes the bar.|Lower slowly to straight arms.',
'Straight-Arm Pulldown':'Set a pulley high with a bar or rope. Step back and hinge slightly at the hips.|With arms nearly straight, pull the bar down in an arc to your thighs.|Return slowly to shoulder height, feeling the lats stretch.',
'Cable Pullover':'Set a pulley high, kneel or stand facing it, holding a rope or bar.|Keeping arms almost straight, sweep the handle down to your hips.|Return slowly overhead.',
'DB Pullover':'Lie across or along a flat bench holding one dumbbell with both hands above your chest.|Lower it behind your head in an arc, elbows slightly bent, until you feel a stretch.|Pull it back over your chest using your lats.',
'Machine Pullover':'Adjust the seat so your shoulders line up with the machine pivot.|Push the pads down in an arc toward your hips with your elbows.|Return slowly to the stretched position.',

'Seated Cable Row':'Sit with feet on the platform, knees slightly bent, back straight, holding the handle.|Pull the handle to your belly, squeezing your shoulder blades together.|Let your arms go straight slowly without rounding your back.',
'Close-Grip Cable Row':'Use a V-handle, sit tall with a slight knee bend.|Row the handle to your belly, elbows close to your sides.|Return slowly to full stretch.',
'Wide-Grip Cable Row':'Use a long bar with a wide grip, sit tall.|Row the bar to your lower chest, elbows out.|Return slowly. Works the upper back and rear delts.',
'One-Arm DB Row':'Put one knee and hand on a bench, back flat, dumbbell hanging in the other hand.|Row the dumbbell toward your hip, elbow close to your side.|Lower slowly to a full stretch. Finish the side, then switch.',
'One-Arm Cable Row':'Set a pulley at chest height, stand or sit holding one handle.|Row it to your side, elbow close to your body.|Return slowly, letting the shoulder reach forward a little.',
'T-Bar Row':'Stand on the platform, hinge forward with a flat back and grip the handles.|Row the weight to your chest, squeezing your shoulder blades.|Lower slowly without rounding your back.',
'Chest-Supported Machine Row':'Adjust the seat so your chest rests on the pad and you can just reach the handles.|Row the handles back, squeezing your shoulder blades together.|Return slowly to straight arms.',
'Chest-Supported DB Row':'Lie face down on a bench set to 30–45°, a dumbbell in each hand.|Row the dumbbells up beside your ribs.|Lower slowly to straight arms.',
'Barbell Bent-Over Row':'Hold the bar, hinge forward to about 45° with a flat back and soft knees.|Row the bar to your lower chest or belly.|Lower slowly, keeping your back flat the whole time.',
'Pendlay Row':'Bar on the floor, hinge until your back is nearly parallel to the floor.|Pull the bar explosively to your lower chest.|Return it to the floor and reset each rep.',
'Smith Machine Row':'Stand at the smith bar, hinge forward with a flat back.|Row the bar to your belly.|Lower slowly. The fixed path makes it easier to keep form.',

'Arnold Press':'Sit with dumbbells in front of your shoulders, palms facing you.|Rotate your palms forward as you press up overhead.|Reverse the turn as you lower.',

'DB Front Raise':'Stand with dumbbells in front of your thighs, palms facing you.|Raise them straight in front to shoulder height, elbows soft.|Lower slowly. No swinging.',
'Cable Front Raise':'Stand facing away from a low pulley, handle between your legs.|Raise the handle to shoulder height in front of you.|Lower slowly.',

'Barbell Front Raise':'Hold a light barbell at your thighs, shoulder-width grip.|Raise it to shoulder height in front of you.|Lower slowly.',

'Machine Lateral Raise':'Sit with the pads against the outside of your arms.|Raise your arms out to the sides to shoulder height.|Lower slowly.',

'Cable Rear-Delt Fly':'Set both pulleys at shoulder height, crossing the cables (left hand holds the right cable).|Pull your arms out and back in a wide arc.|Return slowly.',

'Cable Shrugs':'Hold a bar attached to a low pulley in front of you.|Shrug your shoulders straight up.|Pause and lower slowly.',

function workoutStats(w){

}

const FIRST_RUN=(()=>{try{return !localStorage.getItem(KEY)}catch(e){return false}})();
function daysSinceBackup(){const b=db.settings.lastBackup;return b?Math.floor((new Date(today()+'T00:00:00')-new Date(b+'T00:00:00'))/864e5):null}

/* Change tracking: every workout / weigh-in / settings change gets a timestamp, deletions leave a marker,
   so two devices can be merged without losing or resurrecting anything. */
function snapOf(o){const c=Object.assign({},o);delete c.upd;delete c.at;return JSON.stringify(c)}
var lastSnap;
function takeSnap(){lastSnap={w:new Map(db.workouts.map(w=>[w.id,snapOf(w)])),b:new Map(db.weights.map(x=>[x.date,snapOf(x)])),s:JSON.stringify(db.settings)}}
function stamp(){
  if(!lastSnap){takeSnap();return}
  const now=Date.now();db.deleted=db.deleted||{};
  const ids=new Set();
  for(const w of db.workouts){ids.add(w.id);if(lastSnap.w.get(w.id)!==snapOf(w)){w.upd=now;delete db.deleted[w.id]}}
  for(const id of lastSnap.w.keys())if(!ids.has(id))db.deleted[id]=now;
  const ds=new Set();
  for(const x of db.weights){ds.add(x.date);if(lastSnap.b.get(x.date)!==snapOf(x)){x.at=now;delete db.deleted['w:'+x.date]}}
  for(const d of lastSnap.b.keys())if(!ds.has(d))db.deleted['w:'+d]=now;
  if(lastSnap.s!==JSON.stringify(db.settings))db.settingsAt=now;
  takeSnap();
}
function mergeData(a,b){
  if(!b)return a;
  const del=Object.assign({},b.deleted||{});for(const [k,v] of Object.entries(a.deleted||{}))if(!(del[k]>=v))del[k]=v;
  const tW=w=>w.upd||w.created||0,wm=new Map();
  for(const w of [...(b.workouts||[]),...(a.workouts||[])]){const o=wm.get(w.id);if(!o||tW(w)>=tW(o))wm.set(w.id,w)}
  const workouts=[...wm.values()].filter(w=>!(del[w.id]>=tW(w)));
  const bm=new Map();
  for(const x of [...(b.weights||[]),...(a.weights||[])]){const o=bm.get(x.date);if(!o||(x.at||0)>=(o.at||0))bm.set(x.date,x)}
  const weights=[...bm.values()].filter(x=>!(del['w:'+x.date]>=(x.at||0)));
  const sa=a.settingsAt||0,sb=b.settingsAt||0;
  const aSet=!!(a.settings&&a.settings.height),bSet=!!(b.settings&&b.settings.height);
  const useB=bSet&&(!aSet||sb>sa);
  const settings=Object.assign({plan:'double'},useB?b.settings:a.settings);
  return {workouts,weights,settings,deleted:del,settingsAt:Math.max(sa,sb)||0};
}
const cleanData=d=>({workouts:d.workouts,weights:d.weights,settings:d.settings,deleted:d.deleted||{},settingsAt:d.settingsAt||0});

const CFG=window.LOGBOOK_CONFIG||{};

const OWNER_KEY='gymlog-owner';

function initAccount(){
  if(!CFG.supabaseUrl||!CFG.supabaseKey||!window.supabase||!window.supabase.createClient)return;
  try{acct.sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'logbook-auth'}})}catch(e){acct.sb=null;return}
  acct.sb.auth.onAuthStateChange((ev,session)=>{
    const u=session&&session.user||null,was=acct.user&&acct.user.id;
    acct.user=u;

    if(u&&u.id!==was)setTimeout(()=>onSignedIn(u),0);

}
function onSignedIn(u){
  let owner=null;try{owner=localStorage.getItem(OWNER_KEY)}catch(e){}
  if(owner&&owner!==u.id){db={workouts:[],weights:[],settings:{plan:'double'},deleted:{},settingsAt:0};takeSnap();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
  if(pendingName){db.settings.name=pendingName;pendingName='';persist()}
  try{localStorage.setItem(OWNER_KEY,u.id);localStorage.setItem('gymlog-had-account','1')}catch(e){}

function scheduleSync(){setSync();if(!acct.user)return;clearTimeout(acct.timer);acct.timer=setTimeout(()=>syncNow(),1500)}
function scheduleDraftSync(){}
async function syncNow(first){
  if(!acct.sb||!acct.user)return false;
  if(acct.busy){acct.again=true;return false}
  acct.busy=true;acct.state='syncing';setSync();
  let ok=false;
  try{
    if(navigator.onLine===false)throw new Error('offline');
    const uid=acct.user.id;
    const {data:row,error}=await acct.sb.from('logbooks').select('data').eq('user_id',uid).maybeSingle();
    if(error)throw error;
    const remote=row&&row.data?cleanData(row.data):null;
    stamp();
    const merged=mergeData(cleanData(db),remote);
    const changedLocal=JSON.stringify(merged)!==JSON.stringify(cleanData(db));
    if(changedLocal){
      db=merged;takeSnap();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
      const ae=document.activeElement,typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
      if(!typing&&!document.querySelector('.modal:not([hidden])'))render();
    }
    if(!remote||JSON.stringify(merged)!==JSON.stringify(remote)){
      const {error:e2}=await acct.sb.from('logbooks').upsert({user_id:uid,data:merged,updated_at:new Date().toISOString()});
      if(e2)throw e2;
    }
    acct.state='ok';acct.lastSync=Date.now();ok=true;
    if(first){if(!draft.editingId&&!setsFilled()){freshDraft();saveDraft()}render();closeWelcomeIfOpen();if(!finishLoad.asked){finishLoad.asked=true;setTimeout(maybeCheckin,400)}}
  }catch(e){acct.state=(navigator.onLine===false||String(e&&e.message).includes('fetch'))?'offline':'error';acct.err=e&&e.message||String(e)}
  if(first){if(ok||db.workouts.length||db.settings.height)splashDone();else splashOffline(()=>syncNow(true))}
  if(first&&!ok&&!finishLoad.asked){finishLoad.asked=true;setTimeout(maybeCheckin,400)}
  acct.busy=false;setSync();
  if(tab==='profile'&&!document.querySelector('.modal:not([hidden])'))renderProfile();
  if(acct.again){acct.again=false;setTimeout(()=>syncNow(),300)}
  return ok;
}
function setSync(){
  const el=$('#sync');if(!el)return;
  if(acct.user){el.textContent={syncing:'Syncing…',ok:'Saved to your account',offline:'Offline · will sync when you’re back online',error:'Not synced yet · open Profile › Account'}[acct.state]||'Signed in';return}
  const d=daysSinceBackup();el.textContent='Saved on this phone · '+(d===null?'no backup yet':d===0?'backed up today':`last backup ${d} day${d===1?'':'s'} ago`);
}
window.addEventListener('online',()=>{if(acct.user)syncNow()});

  if(/not confirmed/i.test(m))return 'Please confirm your email first: tap the link we sent you, then sign in here.';
  if(/already registered|already exists/i.test(m))return 'An account with this email already exists. Sign in instead.';
  if(/rate limit|too many/i.test(m))return 'Too many tries. Wait a few minutes and try again.';
  if(/fetch|network/i.test(m))return 'No internet connection. Connect and try again.';
  if(/password/i.test(m))return m;
  return m||'Something went wrong. Try again.'}

$('#auth').addEventListener('click',e=>{

function restoreText(v,after){
  try{const d=JSON.parse(String(v||'').trim());if(!d||!Array.isArray(d.workouts)||!Array.isArray(d.weights))throw 0;
    db={workouts:d.workouts,weights:d.weights,settings:Object.assign({plan:'double'},d.settings||{}),deleted:db.deleted||{},settingsAt:db.settingsAt||0};db.settings.lastBackup=today();persist();closeModal();
    toast(`Restored ${db.workouts.filter(w=>!w.skipped).length} workouts`);if(!draft.editingId&&!setsFilled()){freshDraft();saveDraft()}render();setSync();if(after)after();setTimeout(maybeCheckin,400);return true}
  catch(e){toast('That isn’t a valid backup. Copy it again and paste the whole text.');return false}
}
function restoreFromFile(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json,text/plain';inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreText(r.result);r.readAsText(f)};inp.click()}
let welcoming=false;
function showWelcome(){
  welcoming=true;
  openModal({title:'Welcome to your Workout Logbook',text:'Moving from the logbook in Claude? Open it, go to History, tap Copy backup, then paste it here to bring all your workouts, weight and settings. Otherwise tap Start fresh.',area:{value:'',placeholder:'Paste your backup here'},ok:{label:'Restore my history',fn:v=>{if(restoreText(v))welcoming=false}},alt:acctReady()?{label:'Sign in instead',fn:()=>{welcoming=false;closeModal();showAuth('signin',true)}}:null,cancel:'Start fresh'});
}
function closeWelcomeIfOpen(){if(welcoming){welcoming=false;closeModal()}}
$('#m-cancel').onclick=()=>{closeModal();if(welcoming){welcoming=false;setTimeout(maybeCheckin,200)}};
function initApp(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  initAccount();
  setSync();
  if(acctReady()){
    finishLoad(false);
    const gate=()=>{let had=false;try{had=!!localStorage.getItem('gymlog-had-account')}catch(e){}showAuth(had?'signin':'signup',true)};
    const noSession=()=>{gate();if(navigator.onLine===false){const tryAgain=()=>{if(navigator.onLine===false)splashOffline(tryAgain);else splashDone()};splashOffline(tryAgain)}else splashDone()};
    acct.sb.auth.getSession().then(({data})=>{if(!(data&&data.session))noSession()}).catch(noSession);
  }else{if(FIRST_RUN){finishLoad(false);showWelcome()}else finishLoad(true);splashDone()}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ---------- opening animation ---------- */
const splash={done:false,timer:null};
function splashSet(cls,msg,sub){const el=$('#splash');if(!el||splash.done)return;el.className='splash '+cls;const tg=el.querySelector('.sp-tag');if(tg)tg.hidden=cls==='off';$('#sp-msg').textContent=msg;const sb=$('#sp-sub');sb.hidden=!sub;sb.textContent=sub||'';$('#sp-retry').hidden=cls!=='off'}
function splashLoading(){if(!splash.done)splashSet('load','Loading your workouts')}
function splashDone(){
  if(splash.done)return;const wait=Math.max(0,1600-(Date.now()-(window.SPLASH_T0||0)));
  setTimeout(()=>{if(splash.done)return;splash.done=true;clearTimeout(splash.timer);const el=$('#splash');el.classList.add('bye');setTimeout(()=>{el.hidden=true},320)},wait);
}
function splashOffline(retry){
  if(splash.done)return;splashSet('off','No internet connection','Check your Wi-Fi or mobile data, then try again.');
  $('#sp-retry').onclick=()=>{splashSet('load','Connecting');setTimeout(retry,500)};
}
setTimeout(()=>{const el=$('#splash');if(!splash.done&&el.classList.contains('open'))splashLoading()},1600);
splash.timer=setTimeout(()=>{if(!$('#splash').classList.contains('off'))splashDone()},12000);
function finishLoad(ok){
  if(!draft.editingId&&!setsFilled()){if(draft.date!==today()||!draft.exercises.length)freshDraft();else{const t=draft.type,w=draft.warmDone;applyTemplate(true);draft.type=t;draft.warmDone=w}if(!(draft.cxs||[]).some(c=>String(c.min??'').trim()))delete draft.cxs;try{localStorage.setItem(DKEY,JSON.stringify(draft))}catch(e){}}
  render();
  if(ok&&!finishLoad.asked){finishLoad.asked=true;setTimeout(maybeCheckin,300)}
}
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
go('log');
initApp();
</script>
